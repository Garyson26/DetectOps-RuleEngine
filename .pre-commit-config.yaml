# Pre-commit hooks for DetectOps-RuleEngine.
# Install once per clone:  pre-commit install
# Run on everything:       pre-commit run --all-files
# Every hook repo is pinned to a release tag. Update with: pre-commit autoupdate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # These fixtures are deliberately broken YAML (they test check V001).
        exclude: ^tests/fixtures/validate/invalid/V001_
      - id: end-of-file-fixer
        # Generated by scripts/convert_rules.py; never rewrite generated files.
        exclude: ^platform-translations/
      - id: trailing-whitespace
        exclude: ^platform-translations/
      - id: check-added-large-files
      - id: detect-private-key

  # Secret scanning. gitleaks is used instead of git-secrets: it is actively maintained and
  # covers far more than AWS keys.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: validate-sigma-rules
        name: Validate Sigma rules (scripts/validate_rules.py)
        # Uses the active environment: install requirements-validate.txt first.
        entry: python scripts/validate_rules.py --rules sigma --contract config/logsource_contract.yml
        language: system
        pass_filenames: false
        files: ^(sigma|config)/
