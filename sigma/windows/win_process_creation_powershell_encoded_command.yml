title: PowerShell Started With Encoded Command
id: 0fdf90fb-4962-451d-9d8c-03b9f7a41d30
status: experimental
description: |
  Detects powershell.exe or pwsh.exe started with the -EncodedCommand parameter (or its
  -enc / -ec abbreviations). Attackers pass Base64-encoded scripts this way to hide the
  real command line from casual review and simple string matching.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: Garyson Pereira
date: 2026-10-06
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_encoded:
    CommandLine|contains:
      - ' -enc '
      - ' -encodedcommand '
      - ' -ec '
  condition: all of selection_*
falsepositives:
  - Software deployment and management agents (for example SCCM or Intune scripts) that pass encoded commands
  - Administrative scripts that encode commands to avoid quoting problems
level: medium
