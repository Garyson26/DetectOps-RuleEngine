title: GCP Service Account Key Created
id: 30c32758-f889-4966-8492-f80ddf9062d9
status: experimental
description: |
  Detects creation of a user-managed key for a GCP service account. A downloaded key gives
  long-lived access as that service account from outside Google Cloud.
references:
  - https://attack.mitre.org/techniques/T1098/001/
  - https://cloud.google.com/iam/docs/reference/rest/v1/projects.serviceAccounts.keys/create
author: Garyson Pereira
date: 2026-10-06
tags:
  - attack.persistence
  - attack.t1098.001
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    gcp.audit.method_name: google.iam.admin.v1.CreateServiceAccountKey
  condition: selection
falsepositives:
  - Workloads outside Google Cloud that still need a service account key (prefer workload identity federation)
  - Planned key rotation by the service owner
level: medium
